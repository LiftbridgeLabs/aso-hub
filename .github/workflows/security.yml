# Dependency and secret scans: on every push and pull request, and weekly so new
# advisories against unchanged dependencies are seen.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --exit-code 1'

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pip-audit
        run: |
          python3 -m venv "$RUNNER_TEMP/pa"
          "$RUNNER_TEMP/pa/bin/pip" install --quiet "pip-audit==${PIP_AUDIT_VERSION}"
          "$RUNNER_TEMP/pa/bin/pip-audit" --requirement requirements.txt
  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSION: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner (pinned, checksum verified)
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check
          chmod +x osv-scanner
      - name: Scan
        run: ./osv-scanner scan source --lockfile requirements.txt
