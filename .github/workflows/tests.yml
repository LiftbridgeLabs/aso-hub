# Lint and the full test suite on every push to main and every pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  alert:
    needs: test
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Tell Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.ALERTS_DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || { echo "::warning::ALERTS_DISCORD_WEBHOOK isn't set"; exit 0; }
          body=$(python3 -c 'import json, os; print(json.dumps({"content": "aso-hub: lint or tests failed. " + os.environ["RUN_URL"]}))')
          curl --fail -sS -H "Content-Type: application/json" -d "$body" "$DISCORD_WEBHOOK"
