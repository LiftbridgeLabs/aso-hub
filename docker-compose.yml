# ASO Hub. Put this file in a folder, then:
#
#   docker compose up -d
#   docker logs aso-hub          (shows the setup code)
#
# Open http://127.0.0.1:8690, create your account, and set up the rest under Settings.
services:
  aso-hub:
    image: liftbridgelabs/aso-hub:${ASO_HUB_VERSION:-latest}
    container_name: aso-hub
    restart: unless-stopped
    environment:
      # The address you open the hub at, if it isn't an IP address or localhost,
      # for example https://hub.example.com. Used for links and single sign-on.
      ASO_HUB_URL: ${ASO_HUB_URL:-}
    # Listens on this machine only. To open it from your network, change this to
    # "8690:8690". From anywhere further, put it behind HTTPS first.
    ports:
      - "127.0.0.1:8690:8690"
    volumes:
      # The database and, unless SECRET_KEY is set, the key that encrypts saved secrets.
      - aso-hub-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  aso-hub-data:
