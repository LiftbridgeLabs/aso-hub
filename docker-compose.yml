# ASO Hub from the published image. Put this file, config.toml and
# .env.example (saved as .env) in one folder, or just clone the repository:
#
#   mkdir -p data secrets && sudo chown 1001:1001 data
#   docker compose up -d        then open http://127.0.0.1:8690
#
# config.toml holds your apps and rules. secrets/ holds the key, token and webhook files, readable by
# user 1001. Anything not set up yet is skipped, and the page says what hasn't been read.
services:
  aso-hub:
    image: ${ASO_HUB_IMAGE:?set ASO_HUB_IMAGE in .env}:${ASO_HUB_VERSION:-latest}
    container_name: aso-hub
    restart: unless-stopped
    env_file: .env
    environment:
      HUB_CONFIG: /config/config.toml
      ASC_KEY_PATH: /secrets/asc-key.p8
      GOOGLE_KEY_PATH: /secrets/google-play.json
      ASOBEAST_TOKEN_FILE: /secrets/asobeast-token
      # New to-dos post to this Discord webhook, if the file exists.
      DISCORD_WEBHOOK_FILE: /secrets/discord-webhook
      # Weekly crash digest webhooks: alerts-<app> per app, and alerts-admin for failures.
      ALERTS_WEBHOOK_DIR: /secrets
    # The hub has no sign-in of its own, so it only listens on this machine. Put an
    # authenticating proxy or tunnel in front before opening it any wider.
    ports:
      - "127.0.0.1:8690:8690"
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/data
      - ./secrets:/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
