{# Trend charts: one measure each, with its own scale. The table below has the same numbers. #}
<div class="charts">
  {% for c in charts %}
  <figure class="chart">
    <figcaption>{{ c.title }}</figcaption>
    {% if c.empty %}
    <p class="muted">No numbers for this period yet.</p>
    {% else %}
    <svg viewBox="0 0 {{ c.width }} {{ c.height }}" role="img" aria-label="{{ c.title }}, {{ c.first_label }} to {{ c.last_label }}">
      <line class="grid" x1="0" x2="{{ c.width }}" y1="{{ c.plot_top }}" y2="{{ c.plot_top }}"/>
      <text class="scale" x="0" y="{{ c.plot_top - 4 }}">{{ c.top_label }}</text>
      {% for b in c.bars %}{% if b.path %}<path class="bar" d="{{ b.path }}"/>{% endif %}{% endfor %}
      <line class="axis" x1="0" x2="{{ c.width }}" y1="{{ c.base }}" y2="{{ c.base }}"/>
      <text class="scale" x="0" y="{{ c.height - 4 }}">{{ c.first_label }}</text>
      <text class="scale" x="{{ c.width }}" y="{{ c.height - 4 }}" text-anchor="end">{{ c.last_label }}</text>
      {% for b in c.bars %}
      <rect class="hit" x="{{ '%.1f' | format(b.hit_x) }}" y="0" width="{{ '%.1f' | format(c.slot) }}" height="{{ c.base }}"
            tabindex="0" aria-label="{{ b.tip }}" data-tip="{{ b.tip }}"/>
      {% endfor %}
    </svg>
    {% endif %}
  </figure>
  {% endfor %}
</div>
<div class="tip" id="chart-tip" role="tooltip" hidden></div>
<script src="{{ asset('charts.js') }}" defer></script>
