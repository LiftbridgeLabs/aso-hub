<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Sign in{% endblock %} · ASO Hub</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ asset('icon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ asset('icon-180.png') }}">
  <link rel="stylesheet" href="{{ asset('hub.css') }}">
</head>
<body>
  <main class="sign-in">
    <p class="brand"><span class="mark" aria-hidden="true"></span>ASO Hub</p>
    <section class="panel">
      {% if error %}<p class="banner bad" role="alert">{{ error }}</p>{% endif %}
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
