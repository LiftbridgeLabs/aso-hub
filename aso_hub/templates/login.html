{% extends "auth_base.html" %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/login" class="fields-form">
  <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <button>Sign in</button>
</form>
{% for p in providers %}<p><a class="button quiet" href="/auth/oidc/{{ p.id }}">Sign in with {{ p.name }}</a></p>{% endfor %}
{% endblock %}
